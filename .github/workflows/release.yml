name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 构建 macOS 安装包
    # 项目部署目标为 macOS 26，需要对应 SDK 的 runner
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: 赋予脚本执行权限
        run: chmod +x install-selfuse.sh scripts/*.sh scripts/*.py

      - name: 打包（组装 + ad-hoc 签名 + 去本机路径 + zip）
        run: ./scripts/package-macos.sh dist

      - name: 上传构建产物（仅留档，便于排查失败）
        uses: actions/upload-artifact@v4
        with:
          name: snowsweep-macos-package
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
          # pre-1.0 一律标预发布；推到 v1.x 后自动变正式版
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: false
          fail_on_unmatched_files: true
