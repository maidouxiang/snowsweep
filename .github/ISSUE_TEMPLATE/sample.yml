name: 样本提交
description: 提交已脱敏的 xue.sample/v1 JSON。不要上传原始诊断、截图或真实路径。
title: "[sample] "
labels: ["sample", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **只接受机器脱敏后的 `xue.sample/v1`。**
        请用应用内“导出样本包（脱敏）”生成，不要手工拼 JSON，不要附原始扫描报告。
        公开 issue 的附件对所有人可见；含原始路径、截图、聊天记录的提交会被直接关闭。

  - type: dropdown
    id: sample-kind
    attributes:
      label: 样本类型
      options:
        - 规则未命中
        - 误报 / 误删风险
        - 卸载残留
        - 大文件 / 重复
        - 权限缺口
        - 启动项 / 持久化
    validations:
      required: true

  - type: input
    id: app-family
    attributes:
      label: 应用族（中文名 + Bundle ID）
      placeholder: 某聊天应用 / com.example.chat
    validations:
      required: true

  - type: textarea
    id: sample-json
    attributes:
      label: sample.json 内容
      description: 粘贴导出器生成的 sample.json 全文（已脱敏）。
      render: json
      placeholder: |
        {
          "schema": "xue.sample/v1",
          "sample_id": "...",
          ...
        }
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: 你当时想做什么（脱敏后）
      description: 只写意图类别即可，例如“清理某个应用的缓存”，不要贴原话中的个人信息。

  - type: dropdown
    id: consent
    attributes:
      label: 样本许可
      description: 提交即表示同意该样本以 CC0-1.0 公开（与 sample.json 的 consent 字段一致）。
      options:
        - 同意以 CC0-1.0 公开（public_sample = true）
        - 仅限维护者私密查看（请勿在本表单提交，改走私下渠道）
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前自检
      options:
        - label: 我已用导出器生成，未手工修改路径字段
          required: true
        - label: 本样本不含真实绝对路径、文件名、哈希、截图、聊天记录或账号信息
          required: true
        - label: 我确认 zip 内不含 screenshots/ 目录（或已去 EXIF 并打码）
          required: true
        - label: 我理解维护者可能拒绝无法复现或含隐私线索的样本
          required: true
